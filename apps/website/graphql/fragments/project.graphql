fragment projectArea on ProjectAreaRecord {
  id
  name
  slug
  intro
  image {
    responsiveImage(imgixParams: { fit: crop, w: 920, h: 480, auto: format }) {
      ...responsiveImageFragment
    }
  }
  _updatedAt
}

fragment projectSummary on ProjectRecord {
  id
  title
  slug
  client
  location
  year
  featured
  teaserDescription
  _updatedAt
  teaserImage {
    responsiveImage(imgixParams: { fit: crop, w: 920, h: 480, auto: format }) {
      ...responsiveImageFragment
    }
  }
  area {
    id
    name
    slug
  }
  services {
    id
    title
    ...pageRecordLink
  }
}
