fragment projectArea on ProjectAreaRecord {
  id
  name
  slug
  intro
  seoSettings: seo {
    noIndex
  }
  image {
    focalPoint {
      x
      y
    }
    responsiveImage(imgixParams: { fit: crop, w: 920, h: 480, auto: format }) {
      ...responsiveImageFragment
    }
  }
  _updatedAt
}

fragment projectSummary on ProjectRecord {
  id
  title
  slug
  client
  location
  year
  featured
  teaserDescription
  _updatedAt
  seoSettings: seo {
    noIndex
  }
  # Portrait like the project tiles (4:5), large enough for sharp tiles on retina screens.
  teaserImage {
    focalPoint {
      x
      y
    }
    responsiveImage(imgixParams: { fit: crop, crop: [focalpoint, faces, edges], w: 900, h: 1125, auto: format }) {
      ...responsiveImageFragment
    }
  }
  area {
    id
    name
    slug
  }
  services {
    id
    title
    ...pageRecordLink
  }
}
