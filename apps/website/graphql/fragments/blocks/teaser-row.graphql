fragment teaserRowBlock on TeaserRowRecord {
  id
  disableMarginTop
  disableMarginBottom
  teasers {
    __typename
    ... on PageRecord {
      id
      title
      teaserTitle
      teaserEyebrow
      teaserLinkText
      teaserImage {
        copyright
        responsiveImage {
          ...responsiveImageFragment
        }
      }
      ...pageRecordLink
    }
  }
}
