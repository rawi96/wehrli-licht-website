fragment contactBlock on ContactRecord {
  id
  text
  employee {
    firstname
    phone
    email
    appointmentLink {
      ...pageRecordLink
    }
    appointmentText
    appointmentAnchorLink
    image {
      copyright
      responsiveImage(imgixParams: { fit: crop, w: 208, h: 208, auto: format }) {
        ...responsiveImageFragment
      }
    }
  }
}
