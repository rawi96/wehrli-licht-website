fragment imageBlock on ImageRecord {
  id
  disableMarginTop
  disableMarginBottom
  priority
  images {
    id
    title
    focalPoint {
      x
      y
    }
    copyright
    responsiveImage(imgixParams: { w: 1600, q: 70, auto: format }) {
      ...priorityResponsiveImageFragment
    }
    url
  }
}
