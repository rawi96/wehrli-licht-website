fragment teaserGridBlock on TeaserGridRecord {
  id
  disableMarginTop
  disableMarginBottom
  teasers {
    __typename
    ... on PageRecord {
      id
      title
      teaserDescription
      teaserEyebrow
      teaserTitle
      teaserLinkText
      teaserImage {
        focalPoint {
          x
          y
        }
        copyright
        responsiveImage(imgixParams: { fit: crop, w: 920, h: 480, auto: format }) {
          ...responsiveImageFragment
        }
      }
      ...pageRecordLink
    }
  }
}
