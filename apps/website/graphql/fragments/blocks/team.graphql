fragment teamBlock on TeamRecord {
  id
  teamTitle: title
  disableMarginTop
  disableMarginBottom
  employees {
    firstname
    lastname
    function
    bio
    image {
      responsiveImage(imgixParams: { fit: crop, w: 400, h: 400, auto: format }) {
        ...priorityResponsiveImageFragment
      }
    }
  }
}
