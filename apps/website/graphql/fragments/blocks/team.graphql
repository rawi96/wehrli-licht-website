fragment teamBlock on TeamRecord {
  id
  teamTitle: title
  disableMarginTop
  disableMarginBottom
  employees {
    id
    firstname
    lastname
    function
    bio
    image {
      # Portrait like the team cards (4:5), sharp on retina screens, cropped around the face.
      responsiveImage(imgixParams: { fit: crop, crop: [faces, focalpoint, edges], w: 900, h: 1125, auto: format }) {
        ...priorityResponsiveImageFragment
      }
    }
  }
}
