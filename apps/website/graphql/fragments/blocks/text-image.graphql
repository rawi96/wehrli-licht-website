fragment textImageBlock on TextImageRecord {
  id
  layout
  anchorId
  disableMarginTop
  disableMarginBottom
  content {
    value
    links {
      ... on PageRecord {
        __typename
        ...pageRecordLink
      }
    }
  }
  image {
    focalPoint {
      x
      y
    }
    copyright
    responsiveImage(imgixParams: { w: 1200, auto: format }) {
      ...priorityResponsiveImageFragment
    }
  }
}
