fragment menuLink on MenuLinkRecord {
  label
  path
  page {
    ...pageRecordLink
  }
  shopCategory {
    slug
  }
}

query HeaderFooter {
  headerFooter {
    mainMenu {
      ... on MenuSectionRecord {
        label
        path
        isShop
        page {
          ...pageRecordLink
          teaserDescription
          teaserImage {
            copyright
            responsiveImage(imgixParams: { fit: crop, w: 576, h: 432, auto: format }) {
              ...responsiveImageFragment
            }
          }
        }
        columns {
          ... on MenuColumnRecord {
            title
            overviewLabel
            overviewPath
            page {
              ...pageRecordLink
            }
            links {
              ...menuLink
            }
          }
        }
        footerLinks {
          ...menuLink
        }
      }
    }
    appointmentLabel
    appointmentPage {
      ...pageRecordLink
    }
    facebookUrl
    instagramUrl
    linkedinUrl
    companyName
    contactPage {
      ...pageRecordLink
    }
    privacyPage {
      ...pageRecordLink
    }
    legalPages {
      title
      ...pageRecordLink
    }
    street
    zip
    place
    phone
    email
    mapsLink
    holidayTitle
    holidayText
    holidayDisable
    openingHoursTitle
    openingHoursText
    footerNavigation {
      ... on FooterNavigationGroupRecord {
        title
        links {
          ... on FooterLinkRecord {
            label
            href
          }
        }
      }
    }
  }
}
