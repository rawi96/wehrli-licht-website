fragment menuLink on MenuLinkRecord {
  label
  path
  page {
    ...pageRecordLink
  }
  shopCategory {
    slug
  }
}

query HeaderFooter {
  headerFooter {
    mainMenu {
      ... on MenuSectionRecord {
        label
        path
        isShop
        page {
          ...pageRecordLink
        }
        columns {
          ... on MenuColumnRecord {
            title
            page {
              ...pageRecordLink
            }
            links {
              ...menuLink
            }
          }
        }
        footerLinks {
          ...menuLink
        }
      }
    }
    appointmentLabel
    appointmentPage {
      ...pageRecordLink
    }
    menu {
      ... on DirectoryRecord {
        label
        slug
        navigationItems {
          label
          id
          link {
            ... on PageRecord {
              slug
            }
          }
        }
      }
      ... on NavigationItemRecord {
        label
        link {
          ... on PageRecord {
            slug
          }
        }
      }
    }
    facebookUrl
    instagramUrl
    linkedinUrl
    companyName
    contactPage {
      ...pageRecordLink
    }
    privacyPage {
      ...pageRecordLink
    }
    street
    zip
    place
    phone
    email
    mapsLink
    holidayTitle
    holidayText
    holidayDisable
    openingHoursTitle
    openingHoursText
    footerNavigation {
      ... on FooterNavigationGroupRecord {
        title
        links {
          ... on FooterLinkRecord {
            label
            href
          }
        }
      }
    }
  }
}
