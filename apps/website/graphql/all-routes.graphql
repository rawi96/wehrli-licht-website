query AllRoutes {
  allPages(first: 500) {
    ...pageDetails
    parent {
      ...pageDetails
      parent {
        ...pageDetails
        parent {
          ...pageDetails
          parent {
            ...pageDetails
          }
        }
      }
    }
  }
}

fragment pageDetails on PageRecord {
  id
  slug
  lastModified: _updatedAt
  seometatags {
    noIndex
  }
}
