query FaqPageMeta($slug: String!) {
  # Top-level page only: slugs are unique per parent, a child page may also be called «faq».
  page(filter: { slug: { eq: $slug }, parent: { exists: false } }) {
    title
    teaserEyebrow
    teaserDescription
    seo: _seoMetaTags {
      attributes
      content
      tag
    }
  }
  site: _site {
    favicon: faviconMetaTags {
      attributes
      content
      tag
    }
  }
}
