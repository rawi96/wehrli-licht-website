query LlmsPages {
  allPages(first: 500) {
    id
    title
    slug
    seometatags {
      description
      noIndex
    }
    parent {
      id
      title
      ...llmsParentPath
    }
  }
}

# Same depth as AllRoutes (sitemap), so nested pages get their full path.
fragment llmsParentPath on PageRecord {
  slug
  parent {
    slug
    parent {
      slug
      parent {
        slug
      }
    }
  }
}
