# Pages with a slug: slugs are unique per parent, so the path picks the right one. Four levels of parents, as in
# AllRoutes and pageRecordLink: deeper pages are neither linked nor served.
query PageCandidates($slug: String!) {
  allPages(filter: { slug: { eq: $slug } }, first: 20) {
    id
    slug
    parent {
      slug
      parent {
        slug
        parent {
          slug
          parent {
            slug
          }
        }
      }
    }
  }
}
