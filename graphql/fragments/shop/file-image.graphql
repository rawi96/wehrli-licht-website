fragment shopFileImage on FileField {
  url
  alt
  title
  responsiveImage(imgixParams: { w: 1000, q: 75, auto: format }) {
    ...responsiveImageFragment
  }
}

# Product detail and category tiles: can be the LCP image, see priorityResponsiveImageFragment.
fragment shopPriorityFileImage on FileField {
  url
  alt
  title
  responsiveImage(imgixParams: { w: 1000, q: 75, auto: format }) {
    ...priorityResponsiveImageFragment
  }
}

# Product lists: no blur placeholder (cards render without one), which keeps the list payload small
# (the base64 placeholder of every product image was ~200 KB of HTML on /shop/alle-leuchten).
fragment shopListFileImage on FileField {
  url
  alt
  title
  responsiveImage(imgixParams: { w: 1000, q: 75, auto: format }) {
    ...responsiveImageBaseFragment
  }
}
